<!-- HTML mein Block-level elements woh elements hote hain jo browser ke default layout mein normally new line se start hote hain aur available width lete hain. -->
 <!-- block hamesha next line me aate hai  -->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
 </head>
 <body>
    <div style="background-color: blue;">This is my first div</div>

<!-- inline element- HTML mein Inline elements woh elements hote hain jo normally same line mein rehte hain aur apne content jitni width lete hain. -->
<!-- inline hamesha same line me aate hai -->

    <span style="background-color: chocolate;">This is my first span</span>
 </body>
 </html>
